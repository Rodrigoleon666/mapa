<style>
html,body{margin:0;height:100%;background:#111;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}
#map{position:absolute;inset:0;background:#14161a}
.leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.85) contrast(.95)}
.leaflet-control-attribution{font-size:9px;opacity:.7}
#stat{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:900;background:rgba(15,17,20,.85);color:#fff;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600}
#bar{position:absolute;left:0;right:0;bottom:0;z-index:900;display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.55))}
button,label.b{flex:none;height:46px;min-width:46px;padding:0 14px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(15,17,20,.88);color:#fff;font:600 15px system-ui;display:flex;align-items:center;justify-content:center;cursor:pointer}
#go{flex:1;background:#2fb67c;border:0;color:#04140d}
#go.on{background:#d9453a;color:#fff}
#msg{position:absolute;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:900;color:#fff;font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none}
</style>
</head>
<body>
<div id="map"></div>
<div id="stat">0 km explorados</div>
<div id="msg"></div>
<div id="bar">
  <button id="go">Iniciar</button>
  <button id="me" aria-label="Centrar">◎</button>
  <label class="b" title="Importar GPX">⬆ GPX<input id="imp" type="file" accept=".gpx,.xml" hidden></label>
  <button id="exp" title="Exportar GPX">⬇ GPX</button>
</div>

<script>
const $=id=>document.getElementById(id);
const KEY='mapa_explorado_v1',MAXPTS=20000;
let paths=[],cur=null,watch=null,follow=true,wl=null,me=null,saved=0;
try{paths=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(paths.concat(cur&&cur.length?[cur]:[]).filter(p=>p.length)))}catch(e){msg('No se pudo guardar en el navegador.')}};
const msg=t=>$('msg').textContent=t||'';

function dist(a,b){const R=6371000,t=Math.PI/180,dl=(b[0]-a[0])*t,dn=(b[1]-a[1])*t;
 const x=Math.sin(dl/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const all=()=>cur&&cur.length?paths.concat([cur]):paths;
const km=()=>all().reduce((s,p)=>{for(let i=1;i<p.length;i++)s+=dist(p[i-1],p[i]);return s},0)/1000;
const stat=()=>$('stat').textContent=km().toFixed(2)+' km explorados';

const start0=paths.length?paths[paths.length-1].slice(-1)[0]:[-12.05,-77.04];
const map=L.map('map',{zoomControl:false}).setView(start0,paths.length?16:14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const dot=L.circleMarker(start0,{radius:8,color:'#fff',weight:3,fillColor:'#2fb67c',fillOpacity:1});

// niebla: oscurece lo no explorado y "borra" 30 m a cada lado de tus calles
const fog=document.createElement('canvas');
fog.style.cssText='position:absolute;left:0;top:0;z-index:450;pointer-events:none';
map.getContainer().appendChild(fog);
function draw(){
 const s=map.getSize(),d=window.devicePixelRatio||1;
 fog.width=s.x*d;fog.height=s.y*d;fog.style.width=s.x+'px';fog.style.height=s.y+'px';
 const c=fog.getContext('2d');c.setTransform(d,0,0,d,0,0);

 const mpp=40075016.686*Math.cos(map.getCenter().lat*Math.PI/180)/(256*Math.pow(2,map.getZoom()));
 const path=new Path2D();
 for(const p of all()){p.forEach((q,i)=>{const o=map.latLngToContainerPoint(q);
  if(i)path.lineTo(o.x,o.y);else{path.moveTo(o.x,o.y);if(p.length===1)path.lineTo(o.x+.1,o.y)}})}
 c.lineJoin=c.lineCap='round';
 c.globalCompositeOperation='destination-out';c.strokeStyle='#000';c.lineWidth=Math.max(18,60/mpp);c.stroke(path);

}
map.on('move zoom resize',draw);
map.on('dragstart',()=>follow=false);
map.whenReady(()=>{draw();stat()});

function onPos(pos){
 const c=pos.coords;if(c.accuracy>60)return;
 const p=[+c.latitude.toFixed(5),+c.longitude.toFixed(5)],last=cur[cur.length-1];
 if(!me){me=true;dot.addTo(map)}dot.setLatLng(p);
 if(last&&dist(last,p)<8){return}
 cur.push(p);
 if(follow)map.setView(p,Math.max(map.getZoom(),17),{animate:true});
 draw();stat();
 if(++saved%5===0)save();
}
async function lock(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
function start(){
 if(!navigator.geolocation){msg('Este dispositivo no tiene GPS.');return}
 cur=[];follow=true;
 watch=navigator.geolocation.watchPosition(onPos,e=>{
  msg(e.code===1?'Permiso de ubicación denegado: actívalo en los ajustes del navegador.':'No se pudo obtener la ubicación.');
  if(e.code===1)stop()},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
 lock();$('go').textContent='Detener';$('go').classList.add('on');msg('Mantén la pantalla encendida mientras recorres.');
}
function stop(){
 if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;
 if(wl){wl.release().catch(()=>{});wl=null}
 if(cur&&cur.length)paths.push(cur);cur=null;save();
 $('go').textContent='Iniciar';$('go').classList.remove('on');msg('Recorrido guardado.');setTimeout(msg,3000);
}
$('go').onclick=()=>watch==null?start():stop();
$('me').onclick=()=>{follow=true;const a=all(),l=a.length&&a[a.length-1];if(l&&l.length)map.setView(l[l.length-1],17);else if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],17),()=>msg('No se pudo obtener la ubicación.'))};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&watch!=null)lock()});
window.addEventListener('pagehide',save);

$('imp').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{
  const x=new DOMParser().parseFromString(await f.text(),'application/xml');
  const segs=[...x.getElementsByTagName('trkseg')];
  const lists=segs.length?segs.map(s=>[...s.getElementsByTagName('trkpt')]):[[...x.getElementsByTagName('rtept')]];
  const np=[];
  for(const l of lists){const pa=[];
   for(const n of l){const p=[+(+n.getAttribute('lat')).toFixed(5),+(+n.getAttribute('lon')).toFixed(5)];
    if(isNaN(p[0])||isNaN(p[1]))continue;const last=pa[pa.length-1];if(!last||dist(last,p)>=8)pa.push(p)}
   if(pa.length)np.push(pa)}
  if(!np.length){msg('No encontré recorridos en ese archivo.');return}
  paths=np.concat(paths);while(paths.reduce((s,p)=>s+p.length,0)>MAXPTS)paths=paths.map(p=>p.filter((_,i)=>i%2===0));
  save();draw();stat();map.fitBounds(L.latLngBounds(np.flat()),{padding:[40,40]});msg('Importado: '+f.name);
 }catch(err){msg('No se pudo leer el archivo GPX.')}
};
$('exp').onclick=()=>{
 const a=all();if(!a.length){msg('Aún no hay nada que exportar.');return}
 const g='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Mapa explorado" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Recorridos</name>'+
  a.map(p=>'<trkseg>'+p.map(q=>'<trkpt lat="'+q[0]+'" lon="'+q[1]+'"/>').join('')+'</trkseg>').join('')+'</trk></gpx>';
 const u=URL.createObjectURL(new Blob([g],{type:'application/gpx+xml'})),l=document.createElement('a');
 l.href=u;l.download='recorridos.gpx';document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
};
</script>
</body>
